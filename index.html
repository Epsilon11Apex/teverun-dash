<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teverun Dash</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 40px 20px; }
        button { background: #0A84FF; color: white; border: none; padding: 15px 25px; font-size: 18px; border-radius: 10px; width: 100%; margin-top: 20px; }
        #log { background: #222; margin-top: 20px; padding: 15px; border-radius: 8px; font-family: monospace; text-align: left; font-size: 12px; }
    </style>
</head>
<body>
    <h2>Test Scan Bluetooth</h2>
    <button id="scanBtn">Lancer le Scan Tout Appareil</button>
    <div id="log">Status: En attente...</div>

    <script>
        const scanBtn = document.getElementById('scanBtn');
        const log = document.getElementById('log');

        function print(msg) {
            log.innerHTML += "<br>> " + msg;
        }

        scanBtn.addEventListener('click', async () => {
            log.innerHTML = "Status: Scan en cours...";
            try {
                print("Demande d'accès Bluetooth...");
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true
                });

                print("Appareil sélectionné : " + device.name + " (" + device.id + ")");
                print("Tentative de connexion GATT...");
                
                const server = await device.gatt.connect();
                print("✓ CONNECTÉ AVEC SUCCÈS !");

            } catch (error) {
                print("Erreur : " + error.message);
            }
        });
    </script>
</body>
</html>
