<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teverun Dash</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, sans-serif; text-align: center; padding: 50px 20px; }
        button { background-color: #0A84FF; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 10px; cursor: pointer; width: 100%; max-width: 300px; margin-bottom: 20px; }
        .card { background-color: #1e1e1e; padding: 20px; border-radius: 15px; margin-top: 20px; }
        .metric { font-size: 40px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Teverun Dash</h1>
    <button id="connectBtn">Connecter la Trottinette</button>
    
    <div class="card" id="dashboard" style="display:none;">
        <p>Vitesse</p>
        <div class="metric">-- km/h</div>
        <p>Batterie</p>
        <div class="metric">-- %</div>
        <p style="color: #4CAF50; margin-top: 20px;">✓ Connecté à la Teverun</p>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const dashboard = document.getElementById('dashboard');

        connectBtn.addEventListener('click', async () => {
            try {
                // Mode scan ouvert : détecte TOUS les périphériques Bluetooth autour
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['49535343-fe7d-4ae5-8fa9-9fafd205e455']
                });

                const server = await device.gatt.connect();
                
                // Succès de la connexion
                connectBtn.style.display = 'none';
                dashboard.style.display = 'block';
                
            } catch (error) {
                alert('Erreur : ' + error);
            }
        });
    </script>
</body>
</html>
