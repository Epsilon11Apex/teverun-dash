<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teverun Dash</title>
    <style>
        body { background: #121212; color: white; font-family: -apple-system, sans-serif; text-align: center; padding: 20px 15px; }
        .btn { background: #0A84FF; color: white; border: none; padding: 15px; font-size: 18px; border-radius: 12px; width: 100%; max-width: 350px; font-weight: bold; margin-bottom: 15px; }
        .card { background: #1c1c1e; padding: 20px; border-radius: 16px; margin: 15px auto; max-width: 350px; }
        .value { font-size: 48px; font-weight: bold; color: #30d158; }
        .unit { font-size: 18px; color: #8e8e93; }
        #log { background: #000; color: #00ff66; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 11px; text-align: left; max-height: 180px; overflow-y: auto; margin-top: 15px; word-break: break-all; }
    </style>
</head>
<body>
    <h2>Teverun Dash</h2>
    <button id="connectBtn" class="btn">Connecter la Trottinette</button>

    <div id="dash" style="display:none;">
        <div class="card">
            <div class="unit">VITESSE</div>
            <div class="value" id="speed">0</div>
            <div class="unit">KM/H</div>
        </div>
        <div class="card">
            <div class="unit">BATTERIE</div>
            <div class="value" id="battery">--</div>
            <div class="unit">%</div>
        </div>
    </div>

    <div id="log">> Prêt pour l'envoi de trames...</div>

    <script>
        const SERVICE_UUID = '49535343-fe7d-4ae5-8fa9-9fafd205e455';

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += '<br>> ' + msg;
            l.scrollTop = l.scrollHeight;
        }

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                log('Recherche Teverun...');
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                log('Connexion GATT...');
                const server = await device.gatt.connect();

                log('Obtention du service...');
                const service = await server.getPrimaryService(SERVICE_UUID);

                const characteristics = await service.getCharacteristics();
                let notifyChar = null;
                let writeChar = null;

                for (const char of characteristics) {
                    if (char.properties.notify || char.properties.indicate) {
                        notifyChar = char;
                    }
                    if (char.properties.write || char.properties.writeWithoutResponse) {
                        writeChar = char;
                    }
                }

                if (notifyChar && writeChar) {
                    log('Abonnement écoute...');
                    await notifyChar.startNotifications();
                    
                    notifyChar.addEventListener('characteristicvaluechanged', (e) => {
                        const data = new Uint8Array(e.target.value.buffer);
                        const hex = Array.from(data).map(b => b.toString(16).padStart(2, '0')).join(' ');
                        log('REÇU: ' + hex);
                        
                        // Décodage basique de trame Teverun
                        if (data.length >= 6) {
                            // Selon le protocole, la vitesse et la batterie se trouvent souvent dans les octets 3 à 6
                            document.getElementById('speed').innerText = data[3] !== undefined ? data[3] : 0;
                            document.getElementById('battery').innerText = data[4] !== undefined ? data[4] : '--';
                        }
                    });

                    document.getElementById('connectBtn').style.display = 'none';
                    document.getElementById('dash').style.display = 'block';
                    log('✓ ÉCOUTE ACTIVE ! Envoi des pings...');

                    // Trame standard de requête d'état Teverun (Poll Request)
                    const pollPacket = new Uint8Array([0xAA, 0x55, 0x01, 0x01, 0x00, 0x02]);

                    // Envoi en boucle toutes les 1000ms
                    setInterval(async () => {
                        try {
                            await writeChar.writeValue(pollPacket);
                        } catch (err) {
                            // Ignore les erreurs d'écriture temporaires
                        }
                    }, 1000);

                } else {
                    log('Erreur: Caractéristiques écriture/lecture introuvables.');
                }

            } catch (err) {
                log('ERREUR : ' + (err.message || err));
            }
        });
    </script>
</body>
</html>
