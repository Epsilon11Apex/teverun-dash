<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teverun Dash Pro</title>
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; text-align: center; padding: 15px; margin: 0; }
        .btn { background: #0A84FF; color: white; border: none; padding: 16px; font-size: 18px; border-radius: 14px; width: 100%; font-weight: bold; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .card { background: #1c1c1e; padding: 15px; border-radius: 14px; text-align: center; }
        .full { grid-column: span 2; }
        .title { font-size: 12px; color: #8e8e93; text-transform: uppercase; font-weight: 600; }
        .value { font-size: 36px; font-weight: bold; color: #30d158; margin: 5px 0; }
        .unit { font-size: 14px; color: #8e8e93; }
        .section-title { font-size: 16px; text-align: left; margin: 15px 0 8px 5px; color: #0A84FF; font-weight: bold; }
        .led-btns { display: flex; gap: 8px; }
        .btn-led { flex: 1; padding: 12px; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 14px; cursor: pointer; }
        #log { background: #111; color: #00ff66; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 10px; text-align: left; max-height: 140px; overflow-y: auto; margin-top: 15px; word-break: break-all; }
    </style>
</head>
<body>

    <button id="connectBtn" class="btn">Connecter Teverun</button>

    <div id="dash" style="display:none;">
        <div class="grid">
            <div class="card full">
                <div class="title">Vitesse</div>
                <div class="value" id="speed" style="font-size: 56px;">0</div>
                <div class="unit">KM/H</div>
            </div>
            
            <div class="card">
                <div class="title">Tension</div>
                <div class="value" id="voltage">--.-</div>
                <div class="unit">VOLTS</div>
            </div>

            <div class="card">
                <div class="title">Batterie</div>
                <div class="value" id="battery">--</div>
                <div class="unit">%</div>
            </div>

            <div class="card">
                <div class="title">Courant / Regen</div>
                <div class="value" id="current" style="color: #ff9f0a;">0.0</div>
                <div class="unit">AMPÈRES</div>
            </div>

            <div class="card">
                <div class="title">Température</div>
                <div class="value" id="temp" style="color: #ff453a;">--</div>
                <div class="unit">°C</div>
            </div>
        </div>

        <div class="section-title">Contrôle LED Teverun</div>
        <div class="led-btns">
            <button class="btn-led" style="background: #ff3b30;" onclick="sendLedCmd(1)">Rouge</button>
            <button class="btn-led" style="background: #30d158;" onclick="sendLedCmd(2)">Vert</button>
            <button class="btn-led" style="background: #0a84ff;" onclick="sendLedCmd(3)">Bleu</button>
            <button class="btn-led" style="background: #bf5af2;" onclick="sendLedCmd(4)">Violet</button>
        </div>
    </div>

    <div id="log">> En attente de connexion...</div>

    <script>
        const SERVICE_UUID = '49535343-fe7d-4ae5-8fa9-9fafd205e455';
        let writeChar = null;

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += '<br>> ' + msg;
            l.scrollTop = l.scrollHeight;
        }

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                log('Connexion...');
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristics = await service.getCharacteristics();

                let notifyChar = null;

                for (const char of characteristics) {
                    if (char.properties.notify || char.properties.indicate) notifyChar = char;
                    if (char.properties.write || char.properties.writeWithoutResponse) writeChar = char;
                }

                if (notifyChar && writeChar) {
                    await notifyChar.startNotifications();
                    
                    notifyChar.addEventListener('characteristicvaluechanged', (e) => {
                        const data = new Uint8Array(e.target.value.buffer);
                        const hex = Array.from(data).map(b => b.toString(16).padStart(2, '0')).join(' ');
                        log('REÇU : ' + hex);

                        if (data.length >= 6) {
                            document.getElementById('speed').innerText = data[3] !== undefined ? data[3] : 0;
                            document.getElementById('battery').innerText = data[4] !== undefined ? data[4] : '--';
                            if (data[5]) document.getElementById('voltage').innerText = (data[5] / 10).toFixed(1);
                            if (data[6]) document.getElementById('temp').innerText = data[6];
                        }
                    });

                    document.getElementById('connectBtn').style.display = 'none';
                    document.getElementById('dash').style.display = 'block';
                    log('✓ CONNECTÉ ! Test des pings...');

                    // Sequence de pings alternés
                    const pings = [
                        new Uint8Array([0xAA, 0x55, 0x01, 0x01, 0x00, 0x02]),
                        new Uint8Array([0x02, 0x00, 0x01, 0x00, 0x03]),
                        new Uint8Array([0xA5, 0x5A, 0x01, 0x01, 0x02])
                    ];

                    let pIdx = 0;
                    setInterval(async () => {
                        try {
                            if (writeChar) {
                                await writeChar.writeValue(pings[pIdx % pings.length]);
                                pIdx++;
                            }
                        } catch(e){}
                    }, 1000);
                }
            } catch (err) {
                log('ERREUR : ' + err.message);
            }
        });

        async function sendLedCmd(mode) {
            if (!writeChar) return;
            try {
                // Commandes LED Teverun génériques
                const cmds = {
                    1: new Uint8Array([0xAA, 0x55, 0x06, 0x01, 0xFF, 0x00, 0x00, 0x01]),
                    2: new Uint8Array([0xAA, 0x55, 0x06, 0x01, 0x00, 0xFF, 0x00, 0x01]),
                    3: new Uint8Array([0xAA, 0x55, 0x06, 0x01, 0x00, 0x00, 0xFF, 0x01]),
                    4: new Uint8Array([0xAA, 0x55, 0x06, 0x01, 0xFF, 0x00, 0xFF, 0x01])
                };
                await writeChar.writeValue(cmds[mode]);
                log('LED envoyée mode ' + mode);
            } catch(e) {
                log('Erreur LED: ' + e.message);
            }
        }
    </script>
</body>
</html>
