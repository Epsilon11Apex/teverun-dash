<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teverun Dash Pro</title>
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; text-align: center; padding: 15px; margin: 0; }
        .btn { background: #0A84FF; color: white; border: none; padding: 16px; font-size: 18px; border-radius: 14px; width: 100%; font-weight: bold; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .card { background: #1c1c1e; padding: 15px; border-radius: 14px; text-align: center; }
        .full { grid-column: span 2; }
        .title { font-size: 12px; color: #8e8e93; text-transform: uppercase; font-weight: 600; }
        .value { font-size: 36px; font-weight: bold; color: #30d158; margin: 5px 0; }
        .unit { font-size: 14px; color: #8e8e93; }
        .section-title { font-size: 16px; text-align: left; margin: 15px 0 8px 5px; color: #0A84FF; font-weight: bold; }
        .led-btns { display: flex; gap: 8px; }
        .btn-led { flex: 1; padding: 12px; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 14px; cursor: pointer; }
        #log { background: #111; color: #00ff66; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 10px; text-align: left; max-height: 140px; overflow-y: auto; margin-top: 15px; word-break: break-all; }
    </style>
</head>
<body>

    <button id="connectBtn" class="btn">Connecter Teverun</button>

    <div id="dash" style="display:none;">
        <div class="grid">
            <div class="card full">
                <div class="title">Vitesse</div>
                <div class="value" id="speed" style="font-size: 56px;">0</div>
                <div class="unit">KM/H</div>
            </div>
            
            <div class="card">
                <div class="title">Tension</div>
                <div class="value" id="voltage">--.-</div>
                <div class="unit">VOLTS</div>
            </div>

            <div class="card">
                <div class="title">Batterie</div>
                <div class="value" id="battery">--</div>
                <div class="unit">%</div>
            </div>

            <div class="card">
                <div class="title">Courant / Regen</div>
                <div class="value" id="current" style="color: #ff9f0a;">0.0</div>
                <div class="unit">AMPÈRES</div>
            </div>

            <div class="card">
                <div class="title">Température</div>
                <div class="value" id="temp" style="color: #ff453a;">--</div>
                <div class="unit">°C</div>
            </div>
        </div>

        <div class="section-title">Contrôle LED Teverun</div>
        <div class="led-btns">
            <button class="btn-led" style="background: #ff3b30;" onclick="sendLedColor(255, 0, 0)">Rouge</button>
            <button class="btn-led" style="background: #30d158;" onclick="sendLedColor(0, 255, 0)">Vert</button>
            <button class="btn-led" style="background: #0a84ff;" onclick="sendLedColor(0, 0, 255)">Bleu</button>
            <button class="btn-led" style="background: #bf5af2;" onclick="sendLedColor(255, 0, 255)">Violet</button>
        </div>
    </div>

    <div id="log">> En attente de connexion...</div>

    <script>
        const SERVICE_UUID = '49535343-fe7d-4ae5-8fa9-9fafd205e455';
        let allWriteChars = [];

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += '<br>> ' + msg;
            l.scrollTop = l.scrollHeight;
        }

        async function writeToAll(data) {
            for (const char of allWriteChars) {
                try {
                    if (char.properties.writeWithoutResponse) {
                        await char.writeValueWithoutResponse(data);
                    } else {
                        await char.writeValue(data);
                    }
                } catch(e) {}
            }
        }

        function parseTeverunFrame(data) {
            if (data.length < 5 || data[0] !== 0x55) return;

            const frameType = data[1];

            // Trame 0x71 / 0x72 : Télémétrie Moteurs / Contrôleurs
            if (frameType === 0x71 || frameType === 0x72) {
                if (data[3] !== undefined) {
                    document.getElementById('speed').innerText = data[3];
                }

                // Température
                for (let idx of [5, 6, 7, 11, 12]) {
                    if (data[idx] > 10 && data[idx] < 80) {
                        document.getElementById('temp').innerText = data[idx];
                        break;
                    }
                }

                // Tension corrigée (Lecture sur 16 bits divisée par 10)
                if (data[8] !== undefined && data[9] !== undefined) {
                    const rawVolt = (data[8] << 8) | data[9];
                    if (rawVolt > 300 && rawVolt < 1000) {
                        document.getElementById('voltage').innerText = (rawVolt / 10).toFixed(1);
                    }
                }
            }

            // Trame 0x73 : Batterie & Ampérage
            if (frameType === 0x73) {
                if (data[13] !== undefined && data[13] <= 100) {
                    document.getElementById('battery').innerText = data[13];
                }

                if (data[10] !== undefined) {
                    let rawCurrent = data[10];
                    if (rawCurrent > 128) rawCurrent -= 256;
                    document.getElementById('current').innerText = (rawCurrent / 10).toFixed(1);
                }
            }
        }

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                log('Connexion...');
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristics = await service.getCharacteristics();

                allWriteChars = [];

                for (const char of characteristics) {
                    if (char.properties.notify || char.properties.indicate) {
                        await char.startNotifications();
                        char.addEventListener('characteristicvaluechanged', (e) => {
                            const data = new Uint8Array(e.target.value.buffer);
                            parseTeverunFrame(data);
                        });
                    }
                    if (char.properties.write || char.properties.writeWithoutResponse) {
                        allWriteChars.push(char);
                    }
                }

                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('dash').style.display = 'block';
                log('✓ CONNECTÉ ! Prêt.');

                const pollPacket = new Uint8Array([0xAA, 0x55, 0x01, 0x01, 0x00, 0x02]);

                setInterval(async () => {
                    await writeToAll(pollPacket);
                }, 500);

            } catch (err) {
                log('ERREUR : ' + err.message);
            }
        });

        // Test des 5 trames LED Teverun/Minimotors
        async function sendLedColor(r, g, b) {
            if (allWriteChars.length === 0) {
                log("Erreur : Pas de canal d'écriture.");
                return;
            }

            const calcSum = (arr) => arr.reduce((acc, v) => acc + v, 0) & 0xFF;

            // Variante 1: Standard Teverun App
            const v1_body = [0x07, 0x10, 0x03, r, g, b, 0x01];
            const v1 = new Uint8Array([0xAA, 0x55, ...v1_body, calcSum(v1_body)]);

            // Variante 2: Minimotors / TFT RGB
            const v2_body = [0x06, 0x08, 0x01, r, g, b, 0xFF];
            const v2 = new Uint8Array([0xA5, 0x5A, ...v2_body, calcSum(v2_body)]);

            // Variante 3: Light Controller Board Direct
            const v3_body = [0x05, 0x03, r, g, b];
            const v3 = new Uint8Array([0x55, 0xAA, ...v3_body, calcSum(v3_body)]);

            // Variante 4: Frame 0x0A Mode
            const v4_body = [0x0A, 0x03, r, g, b, 0x00];
            const v4 = new Uint8Array([0xAA, 0x55, ...v4_body, calcSum(v4_body)]);

            // Variante 5: Simple Raw RGB
            const v5 = new Uint8Array([0x55, 0x00, 0x03, r, g, b, (r+g+b) & 0xFF]);

            const packets = [v1, v2, v3, v4, v5];

            log(`--> Test LED (${r},${g},${b}) - 5 paquets...`);
            
            for (let i = 0; i < packets.length; i++) {
                await writeToAll(packets[i]);
            }
            log("✓ Paquets LED envoyés.");
        }
    </script>
</body>
</html>
