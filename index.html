<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teverun Dash</title>
    <style>
        body { background: #121212; color: white; font-family: -apple-system, sans-serif; text-align: center; padding: 20px 15px; }
        .btn { background: #0A84FF; color: white; border: none; padding: 15px; font-size: 18px; border-radius: 12px; width: 100%; max-width: 350px; font-weight: bold; margin-bottom: 15px; }
        .card { background: #1c1c1e; padding: 20px; border-radius: 16px; margin: 15px auto; max-width: 350px; }
        .value { font-size: 48px; font-weight: bold; color: #30d158; }
        .unit { font-size: 18px; color: #8e8e93; }
        #log { background: #000; color: #00ff66; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 11px; text-align: left; max-height: 200px; overflow-y: auto; margin-top: 15px; word-break: break-all; }
    </style>
</head>
<body>
    <h2>Teverun Dash</h2>
    <button id="connectBtn" class="btn">Connecter la Trottinette</button>

    <div id="dash" style="display:none;">
        <div class="card">
            <div class="unit">VITESSE</div>
            <div class="value" id="speed">0</div>
            <div class="unit">KM/H</div>
        </div>
        <div class="card">
            <div class="unit">BATTERIE</div>
            <div class="value" id="battery">--</div>
            <div class="unit">%</div>
        </div>
    </div>

    <div id="log">> Prêt pour l'auto-détection...</div>

    <script>
        const SERVICE_UUID = '49535343-fe7d-4ae5-8fa9-9fafd205e455';

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += '<br>> ' + msg;
            l.scrollTop = l.scrollHeight;
        }

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                log('Recherche de la Teverun...');
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                log('Connexion GATT...');
                const server = await device.gatt.connect();

                log('Récupération du service ' + SERVICE_UUID + '...');
                const service = await server.getPrimaryService(SERVICE_UUID);

                log('Scan des caractéristiques...');
                const characteristics = await service.getCharacteristics();
                log('Nombre de caractéristiques : ' + characteristics.length);

                let notifyChar = null;

                for (const char of characteristics) {
                    const props = [];
                    if (char.properties.read) props.push('READ');
                    if (char.properties.write) props.push('WRITE');
                    if (char.properties.writeWithoutResponse) props.push('WRITE_NO_RESP');
                    if (char.properties.notify) props.push('NOTIFY');
                    if (char.properties.indicate) props.push('INDICATE');

                    log('Carac: ' + char.uuid.substring(0, 8) + '... [' + props.join(', ') + ']');

                    if (char.properties.notify || char.properties.indicate) {
                        notifyChar = char;
                    }
                }

                if (notifyChar) {
                    log('Abonnement à ' + notifyChar.uuid.substring(0, 8) + '...');
                    await notifyChar.startNotifications();
                    
                    notifyChar.addEventListener('characteristicvaluechanged', (e) => {
                        const data = new Uint8Array(e.target.value.buffer);
                        const hex = Array.from(data).map(b => b.toString(16).padStart(2, '0')).join(' ');
                        log('DONNÉES: ' + hex);
                        
                        if (data.length >= 5) {
                            document.getElementById('speed').innerText = data[3] || 0;
                            document.getElementById('battery').innerText = data[4] || '--';
                        }
                    });

                    document.getElementById('connectBtn').style.display = 'none';
                    document.getElementById('dash').style.display = 'block';
                    log('✓ CONNECTÉ ET ÉCOUTE ACTIVE !');
                } else {
                    log('ATTENTION: Aucune caractéristique de notification trouvée.');
                }

            } catch (err) {
                log('ERREUR : ' + (err.message || err));
            }
        });
    </script>
</body>
</html>
